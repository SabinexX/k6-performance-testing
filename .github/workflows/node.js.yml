name: K6 Performance Testing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Executar teste de performance
        run: k6 run src/tests/Tests.spec.js